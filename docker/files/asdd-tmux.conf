# asdd-tmux.conf — baked global tmux config for operator-attached sessions.
#
# Spec 005 (scrollback-history). Copied to /etc/tmux.conf in the project
# image; tmux reads it at SERVER START — i.e. when docker/files/asdd-session.sh
# runs `tmux new-session` — so the single held `claude` pane is born with the
# settings below. asdd-session.sh is intentionally NOT modified.
#
# Source file mode is 0600 (matches the other docker/files/* assets); the
# Dockerfile copies it to /etc/tmux.conf as 0644.

# Predictable copy-mode navigation. Server-neutral: does not affect the
# prefix or the detach binding (Ctrl-b d still detaches, leaving claude up).
set -g mode-keys vi

# US1 — long scrollback. Must be a global `set -g` read before the held pane
# is created, so the pane is born with this depth (history-limit does not
# resize existing panes). 50000 lines ≫ the 2000-line read-back floor (SC-001)
# while keeping the per-pane ring buffer bounded.
set -g history-limit 50000

# US2 — natural mouse-wheel scrolling with no modifier key. Rolling the wheel
# enters copy-mode and scrolls the retained history directly; scrolling to the
# bottom (or new output) returns to the live tail.
set -g mouse on
